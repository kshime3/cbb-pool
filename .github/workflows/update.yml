# Every morning: download scores from ESPN, rescore the pool, publish the page.
# Also runs when you press "Run workflow" on the Actions tab, and whenever a file is changed.
# If the ESPN download fails, nothing is overwritten: the page keeps the last good
# numbers, this run shows a red X, and GitHub emails you.
name: Update pool
on:
  schedule:
    - cron: '17 11 * * *'   # every day at 11:17 UTC = 6:17 am Eastern (7:17 am in summer time)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the scoring rules
        run: node tools/test.js
      - name: Get scores from ESPN
        id: scores
        continue-on-error: true
        run: node tools/update.js
      - name: Save the new numbers
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add data/standings.json data/odds.json
            git commit -m "Scores updated $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - name: Draw the link-preview picture (top 3 for group chats)
        continue-on-error: true
        run: |
          npm install --silent --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright-core@1.49.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" \
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/preview.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report a failed ESPN download (sends you an email)
        if: steps.scores.outcome == 'failure'
        run: |
          echo "::error::The score update had a problem. The page is still showing the last good numbers. Open 'Get scores from ESPN' above to see why."
          exit 1
